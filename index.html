<!DOCTYPE html>
<html>

<head>

<title>CO Smart Detector</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{

background:#0f172a;
color:white;
font-family:Arial;
text-align:center;

}

.card{

background:#1e293b;
margin:20px;
padding:20px;
border-radius:15px;

}

.safe{color:#22c55e;}
.warning{color:#f59e0b;}
.danger{color:#ef4444;}

</style>

</head>

<body>

<h1>CO Smart Detector</h1>

<div class="card">

<h2 id="co">CO: --</h2>

<h2 id="temp">Temp: --</h2>

<h2 id="hum">Humidity: --</h2>

<h2 id="status">Status: --</h2>

</div>

<div class="card">

<canvas id="chart"></canvas>

</div>

<script>

var url="https://cosmart-detector-default-rtdb.firebaseio.com/data.json";

var coData=[];

var chart=new Chart(document.getElementById("chart"),{

type:'line',

data:{
labels:[],
datasets:[{
label:'CO Level',
data:coData,
borderColor:'red'
}]
}

});

function loadData(){

fetch(url)

.then(res=>res.json())

.then(data=>{

document.getElementById("co").innerHTML="CO: "+data.co;

document.getElementById("temp").innerHTML="Temp: "+data.temperature;

document.getElementById("hum").innerHTML="Humidity: "+data.humidity;

var status="SAFE";
var className="safe";

if(data.co>3000){

status="DANGER";
className="danger";

}

else if(data.co>1500){

status="WARNING";
className="warning";

}

var statusElement=document.getElementById("status");

statusElement.innerHTML=status;

statusElement.className=className;

chart.data.labels.push("");

chart.data.datasets[0].data.push(data.co);

chart.update();

});

}

setInterval(loadData,2000);

</script>

</body>

</html>
