<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>CO Smart Detector Liquid UI</title>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {

getDatabase,

ref,

onValue

}

from

"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";


const app = initializeApp({

databaseURL:

"https://cosmart-detector-default-rtdb.firebaseio.com"

});


const db = getDatabase();

window.onload = function(){


const coText = document.getElementById("co");

const tempText = document.getElementById("temp");

const humText = document.getElementById("hum");

const statusText = document.getElementById("status");

const liquid = document.getElementById("liquid");


onValue(ref(db,"data"), snapshot=>{


let data = snapshot.val();

let co = data.co;


coText.innerHTML = co;

tempText.innerHTML = data.temperature+"°C";

humText.innerHTML = data.humidity+"%";


let percent = co/5000*100;

liquid.style.height = percent+"%";


let status="SAFE";

let color="#00ffa6";


if(co>3000){

status="DANGER";

color="#ff3b3b";

}

else if(co>1500){

status="WARNING";

color="#ffaa00";

}


statusText.innerHTML=status;

statusText.style.color=color;

liquid.style.background=color;


});


}

</script>

<style>

body{

margin:0;

height:100vh;

background:

linear-gradient(135deg,#0f2027,#203a43,#2c5364);

display:flex;

justify-content:center;

align-items:center;

font-family:sans-serif;

color:white;

}


.card{

width:320px;

padding:25px;

border-radius:20px;

background:

rgba(255,255,255,0.1);

backdrop-filter:blur(20px);

box-shadow:

0 0 40px rgba(0,0,0,0.3);

text-align:center;

}


.gauge{

width:150px;

height:150px;

border-radius:50%;

border:4px solid rgba(255,255,255,0.2);

margin:auto;

overflow:hidden;

position:relative;

}


.liquid{

position:absolute;

bottom:0;

width:100%;

height:10%;

background:#00ffa6;

transition:1s;

}


h1{

margin-bottom:20px;

}


.data{

margin-top:15px;

font-size:18px;

}


#status{

font-size:22px;

font-weight:bold;

margin-top:10px;

}

</style>

</head>

<body>

<div class="card">

<h1>CO Detector</h1>

<div class="gauge">

<div class="liquid"

id="liquid"></div>

</div>

<div class="data">

CO: <span id="co">0</span>

</div>

<div class="data">

Temp:

<span id="temp">0</span>

</div>

<div class="data">

Humidity:

<span id="hum">0</span>

</div>

<div id="status">

SAFE

</div>

</div>

</body>

</html>
