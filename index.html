<!DOCTYPE html>
<html>

<head>

<title>CO Smart Detector PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/justgage"></script>

<script src="https://cdn.jsdelivr.net/npm/raphael"></script>

<style>

body{

background:#0f172a;
color:white;
font-family:Arial;

}

.container{

display:flex;
flex-wrap:wrap;

}

.card{

background:#1e293b;
margin:15px;
padding:20px;
border-radius:15px;
flex:1;

}

#status{

font-size:30px;

}

.safe{color:#22c55e;}
.warning{color:#f59e0b;}
.danger{
color:#ef4444;
animation: blink 1s infinite;
}

@keyframes blink{

50%{opacity:0;}

}

</style>

</head>

<body>

<h1>CO Smart Detector PRO</h1>

<div class="container">

<div class="card">

<div id="gauge" style="width:200px;height:160px"></div>

</div>

<div class="card">

<h2 id="temp"></h2>

<h2 id="hum"></h2>

<h2 id="status"></h2>

</div>

</div>

<div class="card">

<canvas id="chart"></canvas>

</div>

<script>

var url="https://cosmart-detector-default-rtdb.firebaseio.com/data.json";

var gauge=new JustGage({

id:"gauge",

value:0,

min:0,

max:5000,

title:"CO Level"

});

var chart=new Chart(document.getElementById("chart"),{

type:'line',

data:{

labels:[],

datasets:[{

label:"CO",

data:[],

borderColor:"red"

}]

}

});

function loadData(){

fetch(url)

.then(res=>res.json())

.then(data=>{

gauge.refresh(data.co);

document.getElementById("temp").innerHTML="Temp: "+data.temperature;

document.getElementById("hum").innerHTML="Humidity: "+data.humidity;

var status="SAFE";
var className="safe";

if(data.co>3000){

status="DANGER";
className="danger";

}

else if(data.co>1500){

status="WARNING";
className="warning";

}

var s=document.getElementById("status");

s.innerHTML=status;

s.className=className;

chart.data.labels.push("");

chart.data.datasets[0].data.push(data.co);

chart.update();

});

}

setInterval(loadData,2000);

</script>

</body>
</html>
