<!DOCTYPE html>
<html>

<head>

<title>CO Smart Detector AI PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import { getDatabase, ref, onValue }

from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {

databaseURL:

"https://cosmart-detector-default-rtdb.firebaseio.com"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase();

const coElement = document.getElementById("co");

const tempElement = document.getElementById("temp");

const humElement = document.getElementById("hum");

const statusElement = document.getElementById("status");

const chart = new Chart(

document.getElementById("chart"),

{

type: 'line',

data: {

labels: [],

datasets: [

{

label: 'CO',

data: [],

borderWidth: 2

}

]

}

});

onValue(ref(db, "data"), (snapshot) => {

const data = snapshot.val();

coElement.innerHTML = data.co;

tempElement.innerHTML = data.temperature;

humElement.innerHTML = data.humidity;

let status = "SAFE";

let color = "green";

if (data.co > 3000)

{

status = "DANGER";

color = "red";

}

else if (data.co > 1500)

{

status = "WARNING";

color = "orange";

}

statusElement.innerHTML = status;

statusElement.style.color = color;

chart.data.labels.push("");

chart.data.datasets[0].data.push(data.co);

chart.update();

});

</script>

<style>

body{

background:black;

color:white;

font-family:Arial;

text-align:center;

}

.card{

background:#111;

padding:20px;

margin:20px;

border-radius:10px;

}

</style>

</head>

<body>

<h1>AI CO Detector</h1>

<div class="card">

CO: <span id="co">--</span>

<br>

Temp: <span id="temp">--</span>

<br>

Humidity: <span id="hum">--</span>

<br>

Status: <span id="status">--</span>

</div>

<canvas id="chart"></canvas>

</body>

</html>
