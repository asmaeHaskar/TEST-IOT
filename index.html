<!DOCTYPE html>
<html>

<head>

<title>CO Smart Detector PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/justgage"></script>

<script src="https://cdn.jsdelivr.net/npm/raphael"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
getDatabase,
ref,
onValue
}
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const app = initializeApp({

databaseURL:
"https://cosmart-detector-default-rtdb.firebaseio.com"

});

const db = getDatabase();

window.onload=function(){

// Gauge

var gauge=new JustGage({

id:"gauge",

value:0,

min:0,

max:5000,

title:"CO Level"

});

// Chart

var maxPoints=30;

var chart=new Chart(

document.getElementById("chart"),

{

type:'line',

data:{

labels:[],

datasets:[{

label:"CO Level",

data:[],

borderColor:"red",

borderWidth:2

}]

},

options:{

animation:false,

responsive:true

}

});

// Realtime Firebase

onValue(ref(db,"data"), (snapshot)=>{

var data=snapshot.val();

// update gauge

gauge.refresh(data.co);

// update text

document.getElementById("temp").innerHTML=
"Temp: "+data.temperature+" °C";

document.getElementById("hum").innerHTML=
"Humidity: "+data.humidity+" %";

// status

var status="SAFE";
var className="safe";

if(data.co>3000)
{

status="DANGER";
className="danger";

}
else if(data.co>1500)
{

status="WARNING";
className="warning";

}

var s=document.getElementById("status");

s.innerHTML=status;

s.className=className;


// update chart

chart.data.labels.push("");

chart.data.datasets[0].data.push(data.co);

// limit size

if(chart.data.labels.length>maxPoints)
{

chart.data.labels.shift();

chart.data.datasets[0].data.shift();

}

chart.update("none");

});

}

</script>

<style>

body{

background:#0f172a;
color:white;
font-family:Arial;

}

.container{

display:flex;
flex-wrap:wrap;

}

.card{

background:#1e293b;
margin:15px;
padding:20px;
border-radius:15px;
flex:1;

}

#status{

font-size:30px;

}

.safe{color:#22c55e;}
.warning{color:#f59e0b;}

.danger{

color:#ef4444;

animation: blink 1s infinite;

}

@keyframes blink{

50%{opacity:0;}

}

</style>

</head>

<body>

<h1>CO Smart Detector PRO</h1>

<div class="container">

<div class="card">

<div id="gauge"
style="width:200px;height:160px"></div>

</div>

<div class="card">

<h2 id="temp"></h2>

<h2 id="hum"></h2>

<h2 id="status"></h2>

</div>

</div>

<div class="card">

<canvas id="chart"></canvas>

</div>

</body>

</html>
