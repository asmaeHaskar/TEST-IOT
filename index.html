<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>CO Detector SCADA</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

body{

background:#0a0f1c;
color:white;
font-family:Arial;

}

.card{

background:rgba(255,255,255,0.05);

border-radius:20px;

padding:20px;

margin:20px;

box-shadow:

0 0 30px rgba(0,255,255,0.2);

}

.gauge{

width:200px;
height:200px;

border-radius:50%;

background:

conic-gradient(

cyan 0deg,

cyan 120deg,

#111 120deg

);

}

.glow{

box-shadow:

0 0 20px cyan;

}

</style>

</head>

<body>

<h1>CO Smart Detector AI SCADA</h1>

<div class="card">

<div class="gauge glow"

id="gauge"></div>

<h2 id="co">0</h2>

<h3 id="status">SAFE</h3>

<h3 id="predict">NORMAL</h3>

</div>

<canvas id="chart"></canvas>

<script>

let chart=new Chart(

document.getElementById("chart"),

{

type:'line',

data:{

labels:[],

datasets:[{

data:[]

}]

}

});

function update(data){

let co=data.co;

let percent=co/5000*360;

document.getElementById("gauge").style.background=

`conic-gradient(

cyan ${percent}deg,

#111 ${percent}deg

)`;

chart.data.datasets[0].data.push(co);

chart.update();

}

</script>

</body>

</html>
