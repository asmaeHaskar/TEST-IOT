<!DOCTYPE html>
<html>

<head>

<title>CO Smart Detector PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/justgage"></script>
<script src="https://cdn.jsdelivr.net/npm/raphael"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
}

.card{
background:#1e293b;
margin:15px;
padding:20px;
border-radius:15px;
}

#status{
font-size:30px;
}

.safe{color:#22c55e;}
.warning{color:#f59e0b;}
.danger{
color:#ef4444;
animation: blink 1s infinite;
}

@keyframes blink{
50%{opacity:0;}
}

</style>

</head>


<body>

<h1>CO Smart Detector Dashboard</h1>


<div class="card">

<div id="gauge" style="width:200px;height:160px;margin:auto;"></div>

<h2 id="co"></h2>
<h2 id="smoke"></h2>
<h2 id="status"></h2>

</div>


<div class="card">

<canvas id="chart"></canvas>

</div>


<script>

var url="https://cosmart-detector-default-rtdb.firebaseio.com/data.json";


// Gauge

var gauge=new JustGage({

id:"gauge",

value:0,

min:0,

max:5000,

title:"CO Level"

});


// Chart

var chart=new Chart(document.getElementById("chart"),{

type:'line',

data:{
labels:[],
datasets:[{

label:"CO",

data:[],

borderColor:"red"

}]

}

});



function loadData(){

fetch(url)

.then(res=>res.json())

.then(data=>{


// تحديث القيم

gauge.refresh(data.co);

document.getElementById("co").innerHTML="CO: "+data.co;

document.getElementById("smoke").innerHTML="SMOKE: "+data.smoke;



// استعمال status من Firebase مباشرة

var status=data.status;

var className="safe";


if(status=="DANGER")

className="danger";

else if(status=="WARNING")

className="warning";


var s=document.getElementById("status");

s.innerHTML=status;

s.className=className;



// chart

chart.data.labels.push("");

chart.data.datasets[0].data.push(data.co);

chart.update();


});

}


setInterval(loadData,1000);


</script>


</body>

</html>
